<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Sep Cafe — POS</title>
<link rel="shortcut icon" href="/sep_profile.png" type="image/x-icon">
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- ════════════════════════════════
     TOP BAR
════════════════════════════════ -->
<header class="topbar">
  <div class="logo">Sep <span>Cafe</span></div>

  <!-- Desktop tabs -->
  <div class="topbar-tabs">
    <button class="tab active" onclick="switchTab('orders')">New Order</button>
    <button class="tab" onclick="switchTab('stock')">Stock</button>
    <button class="tab" onclick="switchTab('log')">Log</button>
    <button class="tab" onclick="switchTab('analytics')">Analytics</button>
  </div>

  <!-- Sync badge -->
  <div id="sync-badge" class="sync-badge offline" style="margin-left:8px">
    <span class="sync-dot"></span>Local only
  </div>

  <!-- Mobile cart button -->
  <button class="topbar-cart-btn" onclick="openSheet()" id="cart-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/>
    </svg>
    Order
    <span class="cart-count hidden" id="cart-count">0</span>
  </button>
</header>

<!-- ════════════════════════════════
     APP BODY
════════════════════════════════ -->
<div class="app-body">

  <!-- ── ORDER PANEL ── -->
  <div class="panel active" id="orders-panel">

    <!-- Left: menu -->
    <div class="menu-side">
      <div class="menu-controls">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input class="search-input" type="search" placeholder="Search menu…" oninput="filterItems(this.value)"/>
        </div>
        <div class="cat-scroll" id="cat-tabs"></div>
      </div>
      <div class="item-scroll">
        <div class="item-grid" id="item-grid"></div>
      </div>
    </div>

    <!-- Right: current order (desktop) -->
    <div class="order-side">
      <div class="order-head">
        <span class="order-title">Current Order</span>
        <div class="order-head-btns">
          <button class="icon-btn primary" onclick="printCurrentOrder()">
            <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print
          </button>
          <button class="icon-btn danger" onclick="clearOrder()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Clear
          </button>
        </div>
      </div>
      <div class="order-items" id="order-list-desktop">
        <div class="order-empty"><div class="order-empty-icon">☕</div><span>Tap items to add</span></div>
      </div>
      <div id="order-footer-desktop"></div>
    </div>
  </div>

  <!-- ── STOCK PANEL ── -->
  <div class="panel" id="stock-panel">
    <div class="stock-controls">
      <div class="cat-scroll" id="stock-cat-tabs"></div>
      <button class="action-btn red-btn" onclick="confirmResetShift()">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        Reset Shift
      </button>
    </div>
    <div class="stock-scroll">
      <div class="stock-grid" id="stock-grid"></div>
    </div>
  </div>

  <!-- ── LOG PANEL ── -->
  <div class="panel" id="log-panel">
    <div class="log-scroll">
      <div class="log-toolbar">
        <button class="action-btn green-btn" onclick="endShift()">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          End Shift & Print Summary
        </button>
      </div>
      <div class="stats-row" id="stats-row"></div>
      <div class="section-label">Order history</div>
      <div class="log-grid" id="log-grid"></div>
    </div>
  </div>

  <!-- ── ANALYTICS PANEL ── -->
  <div class="panel" id="analytics-panel">
    <div class="analytics-scroll">
      <div class="analytics-header">
        <span class="analytics-title">Sales Analytics</span>
        <button class="action-btn red-btn" onclick="clearAnalytics()">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
          Clear Data
        </button>
      </div>
      <div id="analytics-content"></div>
    </div>
  </div>

</div><!-- /app-body -->

<!-- ════════════════════════════════
     MOBILE BOTTOM SHEET
════════════════════════════════ -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <span class="order-title">Current Order</span>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="icon-btn primary" onclick="printCurrentOrder()">
        <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
      <button class="icon-btn danger" onclick="clearOrder()">Clear</button>
      <button class="sheet-close" onclick="closeSheet()">&#x2715;</button>
    </div>
  </div>
  <div class="sheet-items" id="order-list-mobile"></div>
  <div id="order-footer-mobile"></div>
</div>

<!-- ════════════════════════════════
     BOTTOM NAV (mobile)
════════════════════════════════ -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bnav-btn active" id="bnav-orders" onclick="switchTab('orders')">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      </span>
      <span class="bnav-label">Orders</span>
    </button>
    <button class="bnav-btn" id="bnav-stock" onclick="switchTab('stock')">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
      </span>
      <span class="bnav-label">Stock</span>
    </button>
    <button class="bnav-btn" id="bnav-log" onclick="switchTab('log')">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </span>
      <span class="bnav-label">Log</span>
    </button>
    <button class="bnav-btn" id="bnav-analytics" onclick="switchTab('analytics')">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      <span class="bnav-label">Stats</span>
    </button>
  </div>
</nav>

<!-- ════════════════════════════════
     MODAL SYSTEM
════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-card" id="modal-card">
    <div class="modal-header">
      <div class="modal-icon green" id="modal-icon">📋</div>
      <div class="modal-title-wrap">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-sub"   id="modal-sub"></div>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div id="modal-input-wrap" style="display:none;padding:0 22px">
      <input class="modal-input" id="modal-input" type="number" min="0"/>
    </div> <br>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- PRINT CONTENT (hidden, shown when printing) -->
<div id="print-content"></div>

<!-- ════════════════════════════════
     SCRIPTS (order matters)
════════════════════════════════ -->
<script src="menu.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>

<script>
// Close modal when clicking the overlay (not the card)
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    closeModal();
    if (_modalResolve) { _modalResolve({ action: 'dismiss', input: null }); _modalResolve = null; }
  }
}
// ESC key closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    if (_modalResolve) { _modalResolve({ action: 'dismiss', input: null }); _modalResolve = null; }
  }
});
</script>

</body>
</html>
